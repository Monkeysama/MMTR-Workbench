name: Workbench checks
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-editor.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/check_commit_message.py --event "$GITHUB_EVENT_PATH"
      - run: python scripts/audit_repository.py --staged
      - run: python -m pip install -r requirements-editor.txt
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:mcp
      - run: python scripts/smoke_workbench_standalone.py
      - run: npm run test:frontend
      - run: npm run build
  desktop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-editor.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-2025-x64-release
          cache-on-failure: 'true'
      - run: npm ci
      - run: npm run core:build
      - run: npm run tauri -- build --no-bundle
      - run: python scripts/package_editor.py
